name: image

# The pre-release image, rebuilt from main. Stable releases are built by the
# release workflow from a tag; this is the one to run on a machine before the
# first release exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The build stage runs on the runner and cross-compiles, so arm64
          # needs no emulation: one build makes both architectures.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/bittrawler/bittrawler:main
            ghcr.io/bittrawler/bittrawler:sha-${{ github.sha }}
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
