name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A hung test must not burn the monthly minutes: GitHub's default job
    # timeout is six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...
      - run: go vet ./...
      - run: go test -race -timeout 10m ./...

  # Start the real binary, call the endpoints an operator or a container health
  # check calls, and prove that SIGTERM shuts it down inside the documented
  # grace period. The crawl is disabled and both sockets are bound to loopback,
  # so the job exercises the process and never the BitTorrent network.
  start-and-call:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: build the binary
        run: go build -o bittrawler .
      - name: start, call and stop
        run: |
          set -euo pipefail

          # The crawl is disabled: this job checks the process, not the
          # BitTorrent network, and GitHub runners must never join it.
          export BITTRAWLER_CRAWLER_ENABLED=false

          # Ask the kernel for a free port for each listener rather than
          # hard-coding one the runner may already be using. HTTP is TCP and the
          # DHT socket is UDP, so they are picked separately.
          http_port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          dht_port=$(python3 -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')

          data_dir=$(mktemp -d)
          log_file="$RUNNER_TEMP/bittrawler.log"

          ./bittrawler run \
            -data "$data_dir" \
            -http "127.0.0.1:${http_port}" \
            -dht "127.0.0.1:${dht_port}" \
            -log-level error >"$log_file" 2>&1 &
          pid=$!
          # Stop the process if the script aborts before the orderly shutdown
          # below, so a failed run leaves no process behind.
          trap 'kill -TERM "$pid" 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 150); do
            if curl -fsS --max-time 1 "http://127.0.0.1:${http_port}/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "the process exited before it became ready" >&2
              cat "$log_file"
              exit 1
            fi
            sleep 0.2
          done
          if [ -z "$ready" ]; then
            echo "no answer from /healthz after 30 seconds" >&2
            cat "$log_file"
            exit 1
          fi

          # /version reports the build and the store schema as JSON.
          version_json=$(curl -fsS --max-time 5 "http://127.0.0.1:${http_port}/version")
          echo "$version_json"
          echo "$version_json" | python3 -c 'import json, sys; data = json.load(sys.stdin); missing = {"version", "commit", "build_date", "store_schema"} - set(data); assert not missing, "/version is missing " + ", ".join(sorted(missing))'

          kill -TERM "$pid"

          exited=""
          for _ in $(seq 1 350); do
            if ! kill -0 "$pid" 2>/dev/null; then
              exited=1
              break
            fi
            sleep 0.1
          done
          if [ -z "$exited" ]; then
            echo "the process did not exit within 35 seconds of SIGTERM" >&2
            cat "$log_file"
            kill -KILL "$pid" 2>/dev/null || true
            exit 1
          fi

          wait "$pid"
          echo "clean shutdown"

  # Build the image exactly as CI would, then smoke-test it the way the compose
  # example runs it: read-only root filesystem, tmpfs /tmp, a bind-mounted data
  # directory. No QEMU and no multi-arch here: the runner is linux/amd64 and the
  # release workflow owns the cross-arch build.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bittrawler:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      - name: run and call the image
        run: |
          set -euo pipefail

          port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          data_dir=$(mktemp -d)

          # The image runs as uid 65532. A bind mount keeps the host ownership,
          # so make this throwaway directory writable before starting.
          chmod 0777 "$data_dir"

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "--- container logs ---" >&2
              docker logs bittrawler-ci 2>&1 || true
            fi
            docker rm -f bittrawler-ci >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run -d --name bittrawler-ci \
            -e BITTRAWLER_CRAWLER_ENABLED=false \
            --read-only \
            --tmpfs /tmp \
            -v "${data_dir}:/data" \
            -p "127.0.0.1:${port}:6684" \
            bittrawler:ci

          ready=""
          for _ in $(seq 1 150); do
            if curl -fsS --max-time 1 "http://127.0.0.1:${port}/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            state=$(docker inspect -f '{{.State.Status}}' bittrawler-ci 2>/dev/null || echo missing)
            case "$state" in
              exited|dead|missing)
                echo "the container exited before it became ready" >&2
                exit 1
                ;;
            esac
            sleep 0.2
          done
          if [ -z "$ready" ]; then
            echo "no answer from /healthz after 30 seconds" >&2
            exit 1
          fi

          echo "healthz: $(curl -fsS --max-time 5 "http://127.0.0.1:${port}/healthz")"
          echo "version: $(curl -fsS --max-time 5 "http://127.0.0.1:${port}/version")"

  # The release workflow is tag-triggered and therefore does not run on a pull
  # request, so at least validate the goreleaser configuration here.
  goreleaser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
