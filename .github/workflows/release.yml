name: release

# Releases come only from a version tag. Branch pushes are handled by ci.yml;
# this workflow stays dormant until a tag is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  packages: write # push the image to GHCR

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs the full history, the tags and the commit metadata.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: set up buildx
        uses: docker/setup-buildx-action@v3
      # A tag with a hand-written note in release-notes/ uses that file instead of
      # the generated notes. The first release needs this: with no previous tag,
      # generated notes would be the entire commit history.
      - name: pick the release notes
        id: notes
        run: |
          file="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            echo "args=--release-notes $file" >> "$GITHUB_OUTPUT"
          fi
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
