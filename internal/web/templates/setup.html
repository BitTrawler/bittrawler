{{define "content"}}
<div class="auth-columns">
  <section class="card auth-card">
    <header class="auth-head">
      <h1>Set Up BitTrawler</h1>
    </header>

    {{if .Error}}<p class="notice error" role="alert">{{.Error}}</p>{{end}}

    <form class="form" method="post" action="/setup">
      <label class="field">
        <span class="field-label">Username</span>
        <input name="username" value="{{.Username}}" autocomplete="username" required maxlength="64" autofocus>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" name="password" autocomplete="new-password" required minlength="10">
        <span class="field-help">Ten characters or more.</span>
      </label>
      <label class="field">
        <span class="field-label">Confirm Password</span>
        <input type="password" name="password_confirm" autocomplete="new-password" required minlength="10">
      </label>
      <label class="field">
        <span class="field-label">TMDB Token <span class="tag optional">optional</span></span>
        <input type="password" name="tmdb_token" autocomplete="off" spellcheck="false">
        <span class="field-help">Read access token from your TMDB account.</span>
      </label>
      <button class="button" type="submit">Finish Setup</button>
    </form>
  </section>

  <aside class="card auth-card">
    <header class="card-head">
      <h2>Torznab Endpoint</h2>
    </header>
    <div class="endpoint">
      <div class="endpoint-row">
        <span class="field-label">URL</span>
        <div class="copy-row">
          <code class="code-block">{{.TorznabURL}}</code>
          <button class="button secondary small" type="button" data-copy="{{.TorznabURL}}">Copy</button>
        </div>
      </div>
      <div class="endpoint-row">
        <span class="field-label">API Key</span>
        <div class="copy-row">
          <code class="code-block">{{.APIKey}}</code>
          <button class="button secondary small" type="button" data-copy="{{.APIKey}}">Copy</button>
        </div>
      </div>
    </div>
  </aside>
</div>
{{end}}
