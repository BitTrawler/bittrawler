{{define "content"}}
<section class="card empty-card">
  <h1>Torrent Not Found</h1>
  {{if .Hash}}
  <p>No torrent with hash <code>{{.Hash}}</code>. It was never indexed, or retention dropped it.</p>
  {{else}}
  <p>Not a valid info hash.</p>
  {{end}}
  <p><a class="button secondary" href="/search">Back to search</a></p>
</section>
{{end}}
