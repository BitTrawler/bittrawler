{{define "auth"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · BitTrawler</title>
<link rel="icon" href="/static/icon.svg?v={{.Version}}" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v={{.Version}}">
<script src="/static/app.js?v={{.Version}}" defer></script>
</head>
<body class="auth">
<main class="auth-shell">
  <a class="auth-brand" href="/">
    <img class="auth-icon" src="/static/icon.svg?v={{.Version}}" alt="" width="34" height="34">
    <span class="auth-word">BitTrawler</span>
  </a>
{{template "content" .}}
</main>
</body>
</html>{{end}}
