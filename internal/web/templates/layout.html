{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · BitTrawler</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2.5 7c1.7 0 2.5-1.4 4.2-1.4S9.2 7 10.9 7s2.5-1.4 4.2-1.4S17.6 7 17.5 7"/><path d="M2.5 11c1.7 0 2.5-1.4 4.2-1.4s2.5 1.4 4.2 1.4 2.5-1.4 4.2-1.4S17.6 11 17.5 11"/><path d="M2.5 15c1.7 0 2.5-1.4 4.2-1.4s2.5 1.4 4.2 1.4 2.5-1.4 4.2-1.4S17.6 15 17.5 15"/></svg></span>
      <span class="brand-word">BitTrawler</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a class="nav-link{{if eq .Active "dashboard"}} is-active{{end}}" href="/">Overview</a>
      <a class="nav-link{{if eq .Active "settings"}} is-active{{end}}" href="/settings">Settings</a>
    </nav>
    <div class="sidebar-foot">
      <div class="crawl-state">
        {{if .Crawling}}<span class="dot is-live"></span><span class="crawl-label">Crawling</span>{{else}}<span class="dot"></span><span class="crawl-label">Paused</span>{{end}}
      </div>
      <div class="build">Version {{.Version}}</div>
      <form method="post" action="/logout"><button class="signout" type="submit">Sign Out</button></form>
    </div>
  </aside>
  <main class="main">
    <div class="content">
{{template "content" .}}
    </div>
  </main>
</div>
</body>
</html>{{end}}
