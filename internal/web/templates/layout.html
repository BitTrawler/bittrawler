{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · BitTrawler</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/logo.svg" alt="BitTrawler">
    </a>
    <nav class="nav" aria-label="Main">
      <a class="nav-link{{if eq .Active "dashboard"}} is-active{{end}}" href="/">Overview</a>
      <a class="nav-link{{if eq .Active "search"}} is-active{{end}}" href="/search">Search</a>
      <a class="nav-link{{if eq .Active "settings"}} is-active{{end}}" href="/settings">Settings</a>
    </nav>
    <div class="sidebar-foot">
      <div class="crawl-state" data-crawl-state>
        {{if .Crawling}}<span class="dot is-live"></span><span class="crawl-label">Crawling</span>{{else}}<span class="dot"></span><span class="crawl-label">Paused</span>{{end}}
      </div>
      <div class="build">Version {{.Version}}</div>
      <form method="post" action="/logout"><button class="signout" type="submit">Sign Out</button></form>
    </div>
  </aside>
  <main class="main">
    <div class="content">
{{template "content" .}}
    </div>
  </main>
</div>
</body>
</html>{{end}}
