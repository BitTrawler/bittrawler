{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · BitTrawler</title>
<link rel="icon" href="/static/icon.svg?v={{.Assets}}" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v={{.Assets}}">
<script src="/static/app.js?v={{.Assets}}" defer></script>
</head>
<body>
<a class="skip" href="#content">Skip to main content</a>
<p class="vh" role="status" id="announcer"></p>
<div class="app">
  <aside class="sidebar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/logo.svg?v={{.Assets}}" alt="BitTrawler">
    </a>
    <form class="side-search" method="get" action="/search" role="search">
      <label class="vh" for="side-search">Search torrents</label>
      <input id="side-search" type="search" name="q" placeholder="Search" autocomplete="off" spellcheck="false">
    </form>
    <nav class="nav" aria-label="Main">
      <a class="nav-link{{if eq .Active "dashboard"}} is-active{{end}}" href="/">Overview</a>
      <a class="nav-link{{if eq .Active "search"}} is-active{{end}}" href="/search">Search</a>
      <a class="nav-link{{if eq .Active "settings"}} is-active{{end}}" href="/settings">Settings</a>
    </nav>
    <div class="sidebar-foot">
      <div class="foot-row">
        <form method="post" action="/logout"><button class="signout" type="submit">Sign Out</button></form>
        <span class="build">{{version .Version}}</span>
      </div>
    </div>
  </aside>
  <main class="main" id="content" tabindex="-1">
    <div class="content">
{{template "content" .}}
    </div>
  </main>
</div>
</body>
</html>{{end}}
