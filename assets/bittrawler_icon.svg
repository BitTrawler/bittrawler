  <g id="classic-network-net" fill="none" stroke="#18DCC7" stroke-width="7.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Suspension from crane ring, three graceful strands -->
    <path d="M 459 104 C 461 162 462 205 455 250"/>
    <path d="M 459 104 C 468 157 490 197 513 222"/>
    <path d="M 459 104 C 485 156 523 198 556 210"/>

    <!-- Draped upper rim of the net -->
    <path d="M 405 315 C 427 296 443 268 455 250"/>
    <path d="M 455 250 Q 483 232 513 222 Q 539 210 556 210"/>
    <path d="M 556 210 Q 590 223 619 252 Q 656 280 684 317"/>

    <!-- Rounded, sagging lower rim -->
    <path d="M 405 315 Q 447 335 482 326 Q 538 359 582 356 Q 636 351 684 317"/>

    <!-- Mesh with the irregular, flowing pattern of the original -->
    <path d="M 455 250 C 462 288 469 305 482 326"/>
    <path d="M 513 222 C 514 246 508 274 505 296"/>
    <path d="M 505 296 L 482 326"/>
    <path d="M 513 222 C 531 241 547 271 565 286"/>
    <path d="M 556 210 Q 559 247 565 286"/>
    <path d="M 619 252 L 565 286"/>
    <path d="M 565 286 Q 525 308 482 326"/>
    <path d="M 565 286 Q 577 324 582 356"/>
    <path d="M 565 286 Q 625 310 684 317"/>
  </g>
  <g fill="#18DCC7" id="network-nodes">
    <circle cx="405" cy="315" r="11.5"/>
    <circle cx="455" cy="250" r="12"/>
    <circle cx="513" cy="222" r="12"/>
    <circle cx="556" cy="210" r="12"/>
    <circle cx="619" cy="252" r="12"/>
    <circle cx="684" cy="317" r="12"/>
    <circle cx="482" cy="326" r="12"/>
    <circle cx="505" cy="296" r="11"/>
    <circle cx="565" cy="286" r="12"/>
    <circle cx="582" cy="356" r="12"/>
  </g>

  <!-- Boat hull, with pronounced bow and clean stern -->
  <path fill="#F8FAFD" d="M 46 219 L 145 229 L 164 178 L 285 178 L 295 263 L 376 285 L 351 309 L 89 257 L 113 323 L 87 334 Z"/>
  <!-- Cabin lintel, three consistent angled windows -->
  <path fill="#F8FAFD" d="M 149 165 H 295 L 303 177 H 145 Z"/>
  <g fill="#071426">
    <path d="M 175 190 L 206 190 L 196 218 L 165 218 Z"/>
    <path d="M 214 190 L 245 190 L 235 218 L 204 218 Z"/>
    <path d="M 253 190 L 282 190 L 281 218 L 243 218 Z"/>
  </g>
