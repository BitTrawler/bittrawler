<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="bittrawler app icon">
<title>bittrawler — app icon</title>
<rect width="1024" height="1024" fill="#071426"/>
<rect x="66" y="66" width="892" height="892" rx="159" fill="none" stroke="#18DCC7" stroke-width="18"/>
<g transform="translate(123 300) scale(1.125)"><g id="trawler-mark" stroke-linejoin="round" stroke-linecap="round">
